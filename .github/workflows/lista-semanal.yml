name: Lista Semanal por Revista (segunda 07:30 BRT)

on:
  schedule:
    - cron: '30 10 * * 1'   # 10:30 UTC = 07:30 BRT, toda segunda-feira
  workflow_dispatch:         # permite rodar manualmente

jobs:
  lista-semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ZAPI_BASE:           ${{ secrets.ZAPI_BASE }}
      ZAPI_CLIENT_TOKEN:   ${{ secrets.ZAPI_CLIENT_TOKEN }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar lista semanal
        run: python distribuidor.py semana
