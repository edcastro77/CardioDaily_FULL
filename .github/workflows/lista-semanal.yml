name: Lista Semanal por Revista (MANUAL — curadoria pelo painel)

# DESLIGADO o envio automático em 27/Jul/2026 (decisão do Dr. Eduardo): a lista semanal passa a ser
# escolhida/enviada pelo Painel de Curadoria, não disparada sozinha. Fica só como disparo manual.
on:
  workflow_dispatch:         # SÓ manual — o cron automático foi removido de propósito

jobs:
  lista-semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ZAPI_BASE:           ${{ secrets.ZAPI_BASE }}
      ZAPI_CLIENT_TOKEN:   ${{ secrets.ZAPI_CLIENT_TOKEN }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-distribuidor.txt

      - name: Enviar lista semanal
        run: python distribuidor.py semana
