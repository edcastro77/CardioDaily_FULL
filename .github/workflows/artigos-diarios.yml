name: Artigos Diários (07:00 — só o que o Dr. Eduardo aprovou na Chave 3)

# ═══ 14/Ago/2026 — O CRON VOLTOU, E AGORA PODE VOLTAR ═══
#
# Pergunta do Dr. Eduardo: *"por que o sistema não usa o mesmo do radar, que envia todos os
# dias independente de como meu computador estiver ligado ou não?"*
#
# O automático foi desligado em 27/Jul por decisão dele — *"o sistema NÃO publica/envia artigo
# sozinho"* — e naquele momento estava CERTO: a curadoria não existia, então automático
# significava a máquina escolhendo. Hoje é o contrário: **quem escolhe é ele, na Chave 3**, e
# o cron só cumpre o horário. O distribuidor lê a tabela `agenda_envio` e nada mais; agenda
# vazia = nada sai. Não existe seleção por tema, por nota nem por data.
#
# O QUE DESTRAVOU: até 14/Ago a agenda morava em `saidas/agenda_envio.csv`, no Mac dele — e a
# nuvem não enxerga o disco dele. Era o ÚNICO motivo pelo qual isto não podia rodar como o
# Radar. A agenda foi para o Supabase; o obstáculo era um arquivo.
#
# 10:00 UTC = 07:00 BRT. Meia hora antes do Radar (10:30 UTC), de propósito: ele pediu o
# artigo junto com o Radar, e o artigo vem primeiro.
on:
  schedule:
    - cron: '0 10 * * *'    # 10:00 UTC = 07:00 BRT
  workflow_dispatch:        # e continua disparável na mão, quando ele quiser

jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ZAPI_BASE:           ${{ secrets.ZAPI_BASE }}
      ZAPI_CLIENT_TOKEN:   ${{ secrets.ZAPI_CLIENT_TOKEN }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      BETA_PAUSADO:        ${{ secrets.BETA_PAUSADO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-distribuidor.txt

      - name: Distribuir artigos
        run: python distribuidor.py artigos
