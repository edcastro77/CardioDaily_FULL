name: Artigos Diários (MANUAL — curadoria pelo painel)

# DESLIGADO o envio automático em 27/Jul/2026 (decisão do Dr. Eduardo): o sistema NÃO publica/envia
# artigo sozinho. A curadoria passa a ser MANUAL pelo Painel de Curadoria (src/painel_curadoria.py).
# Só o Radar continua automático (radar.yml). Este workflow fica só como disparo manual de emergência.
on:
  workflow_dispatch:        # SÓ manual — o cron automático foi removido de propósito

jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ZAPI_BASE:           ${{ secrets.ZAPI_BASE }}
      ZAPI_CLIENT_TOKEN:   ${{ secrets.ZAPI_CLIENT_TOKEN }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      BETA_PAUSADO:        ${{ secrets.BETA_PAUSADO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-distribuidor.txt

      - name: Distribuir artigos
        run: python distribuidor.py artigos
