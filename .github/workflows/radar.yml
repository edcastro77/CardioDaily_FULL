name: Radar CardioDaily (07:30 BRT)

on:
  schedule:
    - cron: '30 10 * * *'  # 10:30 UTC = 07:30 BRT
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
      ENTREZ_EMAIL:         ${{ secrets.ENTREZ_EMAIL }}
      ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID:  ${{ secrets.ELEVENLABS_VOICE_ID }}
      ZAPI_BASE:            ${{ secrets.ZAPI_BASE }}
      ZAPI_CLIENT_TOKEN:    ${{ secrets.ZAPI_CLIENT_TOKEN }}
      TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
      BETA_PAUSADO:         ${{ secrets.BETA_PAUSADO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar podcast do radar
        run: python scripts/run_radar_diario.py

      - name: Enviar radar via WhatsApp e Telegram
        run: python distribuidor.py radar
