<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* ═══ CARD ACRI — 1080×1350 (4:5, feed do Instagram) ═══
     Layout do Dr. Eduardo (card-acri.html), adaptado de link horizontal do site para
     imagem de altura FIXA. A diferença mais importante: aqui não existe "o texto corre
     mais um pouco". O quadro é fechado, e é por isso que o prompt limita cada frase a
     90–140 caracteres. Densidade garantida na ORIGEM, que é a condição que a proibição
     do CLAUDE.md exigia para ser revogada. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: #f3f2f2; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; }

  .card { width: 1080px; height: 1350px; border: 5px solid #201e1d; padding: 64px 64px 0; display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .meta { font-size: 26px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5f5b57; line-height: 1.45; }
  .badges { display: flex; gap: 12px; flex-shrink: 0; }
  .nota { background: #ec3013; color: #fff; font-weight: 800; font-size: 26px; padding: 9px 20px; letter-spacing: .04em; white-space: nowrap; }
  .conduta { border: 4px solid #201e1d; color: #201e1d; font-weight: 800; font-size: 26px; padding: 5px 20px; letter-spacing: .04em; white-space: nowrap; }

  /* o título encolhe em degraus conforme o comprimento — o prompt limita a 70 chars,
     mas um título de 68 e um de 40 não podem ter o mesmo corpo sem deixar buraco */
  .titulo { font-weight: 800; line-height: 1.08; margin: 34px 0 30px; color: #201e1d;
            font-size: 62px; }
  .titulo.medio { font-size: 54px; }
  .titulo.longo { font-size: 46px; }

  .grid { display: grid; grid-template-columns: 62px 1fr; column-gap: 28px; flex: 1; align-content: start; }
  .letra { border-bottom: 2px solid #d8d6d4; padding: 22px 0; font-weight: 800; font-size: 46px; color: #ec3013; line-height: 1; }
  .texto { border-bottom: 2px solid #d8d6d4; padding: 24px 0; font-size: 31px; line-height: 1.42; color: #201e1d; }
  .letra.ult, .texto.ult { border-bottom: none; }
  .texto b { font-weight: 800; }

  .rodape { border-top: 5px solid #201e1d; margin-top: auto; padding: 26px 0 30px; display: flex; justify-content: space-between; align-items: center; }
  .marca { display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5f5b57; }
  .marca img { height: 52px; width: auto; }
  .site { font-size: 26px; font-weight: 700; color: #a1220d; }
</style>
</head>
<body>
<div class="card">

  <div class="top">
    <div class="meta">{{ area }}<br>{{ revista }} · {{ ano }}</div>
    <div class="badges">
      <span class="nota">NOTA {{ nota }}/10</span>
      {% if selo_conduta %}<span class="conduta">{{ selo_conduta }}</span>{% endif %}
    </div>
  </div>

  <div class="titulo {{ classe_titulo }}">{{ titulo }}</div>

  <div class="grid">
    <div class="letra">A</div>
    <div class="texto">{{ a }}</div>
    <div class="letra">C</div>
    <div class="texto">{{ c }}</div>
    <div class="letra">R</div>
    <div class="texto">{{ r|safe }}</div>
    <div class="letra ult">I</div>
    <div class="texto ult">{{ i }}</div>
  </div>

  <div class="rodape">
    <div class="marca">
      {% if logo %}<img src="{{ logo }}" alt="">{% endif %}
      CardioDaily · fatos sem firulas
    </div>
    <div class="site">cardiodaily.com.br</div>
  </div>

</div>
</body>
</html>
